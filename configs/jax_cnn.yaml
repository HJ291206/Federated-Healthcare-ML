# JAX 1D-CNN vs JAX MLP vs PyTorch MLP. Results go to results/jax/.
data:
  file: diabetes_binary_health_indicators_BRFSS2015.csv
  test_size: 0.15
  val_size: 0.15
  split_seed: 42          # same split as configs/centralized.yaml

seeds: [0]

# Shared training recipe (identical to the centralized PyTorch MLP).
training:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 512
  max_epochs: 15
  patience: 3

mlp:
  hidden_sizes: [64, 32]
  dropout: 0.1

cnn:
  channels: [16, 32]
  kernel_size: 3
  hidden: 32
  dropout: 0.1
  permutation_seeds: [1]   # extra runs with shuffled feature columns

threshold:
  recall_target: 0.80
torch_threads: 4
